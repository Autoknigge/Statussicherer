name: APK bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP entpacken
        run: unzip -q "$(find . -name 'StatusSicherer*.zip' | head -n 1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Festen Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/status-sicherer.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/status-sicherer.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Schlüssel hinterlegt - APK wird mit Testschlüssel signiert."
          fi
      - name: APK bauen
        working-directory: StatusSicherer
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_OPEN_ID: ${{ secrets.ADMOB_OPEN_ID }}
        run: >
          gradle assembleRelease bundleRelease --no-daemon --stacktrace
          -PADMOB_APP_ID="$ADMOB_APP_ID"
          -PADMOB_BANNER_ID="$ADMOB_BANNER_ID"
          -PADMOB_OPEN_ID="$ADMOB_OPEN_ID"
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp StatusSicherer/app/build/outputs/apk/release/app-release.apk Status-Sicherer.apk
          cp StatusSicherer/app/build/outputs/bundle/release/app-release.aab Status-Sicherer.aab
          gh release delete aktuell --yes --cleanup-tag || true
          gh release create aktuell Status-Sicherer.apk Status-Sicherer.aab --title "Status-Sicherer" --notes "Aktuelle Version (APK zum Installieren, AAB für Google Play)" --target "${{ github.sha }}"
