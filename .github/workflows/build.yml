name: APK bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP entpacken
        run: unzip -q ./*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: APK bauen
        working-directory: StatusSicherer
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp StatusSicherer/app/build/outputs/apk/debug/app-debug.apk Status-Sicherer.apk
          gh release delete aktuell --yes --cleanup-tag || true
          gh release create aktuell Status-Sicherer.apk --title "Status-Sicherer" --notes "Aktuelle Version" --target "${{ github.sha }}"
